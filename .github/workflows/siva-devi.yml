name: OpenTofu Apply Workflow

on:
  push:
    branches:
      - main
    paths:
      - 'workspace/**'

permissions:
  contents: read

concurrency:
  group: tofu-apply-${{ github.ref }}
  cancel-in-progress: false

env:
  TOFU_VERSION: "1.12.5"

  GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}

  GCP_WORKLOAD_IDENTITY_PROVIDER: >-
    ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}

  GCP_SERVICE_ACCOUNT: >-
    ${{ vars.GCP_SERVICE_ACCOUNT }}

  CHECKOV_EXCEPTIONS_FILE: "exceptions/terraform-exceptions.txt"

jobs:

  # ============================================================
  # OPEN TOFU PLAN
  # ============================================================

  tofu-plan:
    name: OpenTofu Plan
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      id-token: write
      contents: read

    outputs:
      plan_created: ${{ steps.plan.outputs.plan_created }}

    steps:

      # ----------------------------------------------------------
      # Checkout
      # ----------------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # ----------------------------------------------------------
      # Setup OpenTofu
      # ----------------------------------------------------------

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@v2
        with:
          tofu_version: ${{ env.TOFU_VERSION }}
          tofu_wrapper: false

      - name: Verify OpenTofu
        shell: bash
        run: |
          set -euo pipefail
          tofu version

      # ----------------------------------------------------------
      # Authenticate to GCP using Workload Identity Federation
      # ----------------------------------------------------------

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_SERVICE_ACCOUNT }}

      # ----------------------------------------------------------
      # Setup Google Cloud CLI
      # ----------------------------------------------------------

      - name: Setup Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v3
        with:
          version: ">= 363.0.0"

      # ----------------------------------------------------------
      # Verify GCP authentication
      # ----------------------------------------------------------

      - name: Verify GCP authentication
        shell: bash
        run: |
          set -euo pipefail

          gcloud auth list
          gcloud config set project "${GCP_PROJECT_ID}"

      # ----------------------------------------------------------
      # Find OpenTofu root directories
      #
      # Any change under workspace/ triggers this workflow.
      #
      # Reusable modules are excluded from direct plan/apply.
      # ----------------------------------------------------------

      - name: Find OpenTofu directories
        shell: bash
        run: |
          set -euo pipefail

          DIRS_FILE="${RUNNER_TEMP}/tofu-dirs.txt"

          find workspace \
            -type f \
            -name "*.tf" \
            -not -path "*/modules/*" \
            -printf '%h\n' |
            sort -u > "${DIRS_FILE}"

          if [[ ! -s "${DIRS_FILE}" ]]; then
            echo "::error::No OpenTofu root directories found under workspace/"
            exit 1
          fi

          echo "OpenTofu root directories found:"
          cat "${DIRS_FILE}"

      # ----------------------------------------------------------
      # Create plan directory
      # ----------------------------------------------------------

      - name: Create plan directory
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "${RUNNER_TEMP}/tofu-plans"

      # ==========================================================
      # OPEN TOFU PLAN
      # ==========================================================

      - name: Run OpenTofu plan
        id: plan
        shell: bash
        run: |
          set -euo pipefail

          DIRS_FILE="${RUNNER_TEMP}/tofu-dirs.txt"
          PLAN_DIRECTORY="${RUNNER_TEMP}/tofu-plans"

          while IFS= read -r DIR; do

            [[ -z "${DIR}" ]] && continue

            echo "::group::OpenTofu - ${DIR}"

            cd "${GITHUB_WORKSPACE}/${DIR}"

            echo "Working directory:"
            echo "${PWD}"

            # --------------------------------------------------
            # Initialize OpenTofu
            #
            # Lock file is NOT committed or modified in Git.
            # Any generated lock file exists only on this
            # temporary GitHub-hosted runner.
            # --------------------------------------------------

            tofu init \
              -input=false

            # --------------------------------------------------
            # Format check
            # --------------------------------------------------

            tofu fmt \
              -check \
              -diff

            # --------------------------------------------------
            # Validate
            # --------------------------------------------------

            tofu validate

            # --------------------------------------------------
            # Create unique plan filename
            # --------------------------------------------------

            PLAN_NAME="$(echo "${DIR}" | tr '/' '_')"

            PLAN_FILE="${PLAN_DIRECTORY}/${PLAN_NAME}.tfplan"

            # --------------------------------------------------
            # Create plan
            # --------------------------------------------------

            echo "Creating plan:"
            echo "${PLAN_FILE}"

            tofu plan \
              -input=false \
              -out="${PLAN_FILE}"

            # --------------------------------------------------
            # Convert plan to JSON
            # --------------------------------------------------

            tofu show \
              -json \
              "${PLAN_FILE}" \
              > "${PLAN_FILE}.json"

            echo "Plan created successfully:"

            ls -lh "${PLAN_FILE}"
            ls -lh "${PLAN_FILE}.json"

            echo "::endgroup::"

          done < "${DIRS_FILE}"

          echo "plan_created=true" >> "${GITHUB_OUTPUT}"

      # ==========================================================
      # TFSEC
      # ==========================================================

      - name: Install tfsec
        shell: bash
        run: |
          set -euo pipefail

          TFSEC_VERSION="v1.28.14"
          TFSEC_PATH="${RUNNER_TEMP}/tfsec"

          echo "Installing tfsec ${TFSEC_VERSION}"

          curl -sSL \
            -o "${TFSEC_PATH}" \
            "https://github.com/aquasecurity/tfsec/releases/download/${TFSEC_VERSION}/tfsec-linux-amd64"

          chmod +x "${TFSEC_PATH}"

          echo "Verifying tfsec installation:"

          "${TFSEC_PATH}" --version

      # ----------------------------------------------------------
      # Run tfsec
      # ----------------------------------------------------------

      - name: Run tfsec
        shell: bash
        run: |
          set -euo pipefail

          DIRS_FILE="${RUNNER_TEMP}/tofu-dirs.txt"
          TFSEC_PATH="${RUNNER_TEMP}/tfsec"

          if [[ ! -x "${TFSEC_PATH}" ]]; then
            echo "::error::tfsec executable not found at ${TFSEC_PATH}"
            exit 1
          fi

          while IFS= read -r DIR; do

            [[ -z "${DIR}" ]] && continue

            echo "::group::tfsec - ${DIR}"

            cd "${GITHUB_WORKSPACE}/${DIR}"

            echo "Running tfsec in:"
            echo "${PWD}"

            "${TFSEC_PATH}"

            echo "::endgroup::"

          done < "${DIRS_FILE}"

      # ==========================================================
      # CHECKOV
      # ==========================================================

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Install Checkov
        shell: bash
        run: |
          set -euo pipefail

          python -m pip install --upgrade pip
          python -m pip install checkov

          checkov --version

      # ----------------------------------------------------------
      # Run Checkov against OpenTofu plan JSON
      # ----------------------------------------------------------

      - name: Run Checkov
        shell: bash
        run: |
          set -euo pipefail

          DIRS_FILE="${RUNNER_TEMP}/tofu-dirs.txt"
          EXCEPTIONS_FILE="${GITHUB_WORKSPACE}/${CHECKOV_EXCEPTIONS_FILE}"

          CHECKOV_SKIP_ARGS=()

          if [[ -f "${EXCEPTIONS_FILE}" ]]; then

            echo "Reading Checkov exceptions from:"
            echo "${EXCEPTIONS_FILE}"

            while IFS= read -r CHECK_ID; do

              # Skip empty lines
              [[ -z "${CHECK_ID}" ]] && continue

              # Skip comments
              [[ "${CHECK_ID}" =~ ^[[:space:]]*# ]] && continue

              # Remove leading/trailing whitespace
              CHECK_ID="$(echo "${CHECK_ID}" | xargs)"

              if [[ -n "${CHECK_ID}" ]]; then

                echo "Skipping approved Checkov check:"
                echo "${CHECK_ID}"

                CHECKOV_SKIP_ARGS+=(
                  "--skip-check"
                  "${CHECK_ID}"
                )

              fi

            done < "${EXCEPTIONS_FILE}"

          else

            echo "No Checkov exception file found."

          fi

          while IFS= read -r DIR; do

            [[ -z "${DIR}" ]] && continue

            PLAN_NAME="$(echo "${DIR}" | tr '/' '_')"

            PLAN_JSON="${RUNNER_TEMP}/tofu-plans/${PLAN_NAME}.tfplan.json"

            if [[ ! -f "${PLAN_JSON}" ]]; then

              echo "::error::Checkov plan file not found:"
              echo "${PLAN_JSON}"

              exit 1

            fi

            echo "::group::Checkov - ${DIR}"

            echo "Running Checkov against:"
            echo "${PLAN_JSON}"

            checkov \
              -f "${PLAN_JSON}" \
              --framework terraform \
              "${CHECKOV_SKIP_ARGS[@]}"

            echo "::endgroup::"

          done < "${DIRS_FILE}"

      # ==========================================================
      # UPLOAD PLAN ARTIFACT
      # ==========================================================

      - name: Upload OpenTofu plan
        uses: actions/upload-artifact@v6
        with:
          name: tofu-plan-${{ github.sha }}
          path: ${{ runner.temp }}/tofu-plans/
          if-no-files-found: error
          retention-days: 5


  # ============================================================
  # OPEN TOFU APPLY
  # ============================================================

  tofu-apply:
    name: OpenTofu Apply
    runs-on: ubuntu-latest
    timeout-minutes: 30

    needs:
      - tofu-plan

    if: needs.tofu-plan.outputs.plan_created == 'true'

    environment:
      name: production

    permissions:
      id-token: write
      contents: read

    steps:

      # ----------------------------------------------------------
      # Checkout exact commit that generated the plan
      # ----------------------------------------------------------

      - name: Checkout exact commit
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      # ----------------------------------------------------------
      # Setup OpenTofu
      # ----------------------------------------------------------

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@v2
        with:
          tofu_version: ${{ env.TOFU_VERSION }}
          tofu_wrapper: false

      - name: Verify OpenTofu
        shell: bash
        run: |
          set -euo pipefail
          tofu version

      # ----------------------------------------------------------
      # Authenticate to GCP using WIF
      # ----------------------------------------------------------

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_SERVICE_ACCOUNT }}

      # ----------------------------------------------------------
      # Setup Google Cloud CLI
      # ----------------------------------------------------------

      - name: Setup Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v3
        with:
          version: ">= 363.0.0"

      # ----------------------------------------------------------
      # Verify GCP authentication
      # ----------------------------------------------------------

      - name: Verify GCP authentication
        shell: bash
        run: |
          set -euo pipefail

          gcloud auth list
          gcloud config set project "${GCP_PROJECT_ID}"

      # ----------------------------------------------------------
      # Find OpenTofu directories
      # ----------------------------------------------------------

      - name: Find OpenTofu directories
        shell: bash
        run: |
          set -euo pipefail

          DIRS_FILE="${RUNNER_TEMP}/tofu-dirs.txt"

          find workspace \
            -type f \
            -name "*.tf" \
            -not -path "*/modules/*" \
            -printf '%h\n' |
            sort -u > "${DIRS_FILE}"

          if [[ ! -s "${DIRS_FILE}" ]]; then
            echo "::error::No OpenTofu root directories found."
            exit 1
          fi

          echo "OpenTofu directories:"
          cat "${DIRS_FILE}"

      # ----------------------------------------------------------
      # Download exact plan generated by Plan job
      # ----------------------------------------------------------

      - name: Download approved OpenTofu plan
        uses: actions/download-artifact@v6
        with:
          name: tofu-plan-${{ github.sha }}
          path: ${{ runner.temp }}/tofu-plans

      # ----------------------------------------------------------
      # Verify plan artifact
      # ----------------------------------------------------------

      - name: Verify plan artifact
        shell: bash
        run: |
          set -euo pipefail

          PLAN_DIRECTORY="${RUNNER_TEMP}/tofu-plans"

          if [[ ! -d "${PLAN_DIRECTORY}" ]]; then
            echo "::error::OpenTofu plan directory not found."
            exit 1
          fi

          echo "Downloaded plan files:"

          find "${PLAN_DIRECTORY}" \
            -maxdepth 1 \
            -type f \
            -name "*.tfplan" \
            -print

      # ==========================================================
      # APPLY EXACT PLAN
      # ==========================================================

      - name: Apply approved plan
        shell: bash
        run: |
          set -euo pipefail

          DIRS_FILE="${RUNNER_TEMP}/tofu-dirs.txt"
          PLAN_DIRECTORY="${RUNNER_TEMP}/tofu-plans"

          while IFS= read -r DIR; do

            [[ -z "${DIR}" ]] && continue

            echo "::group::OpenTofu Apply - ${DIR}"

            cd "${GITHUB_WORKSPACE}/${DIR}"

            echo "Working directory:"
            echo "${PWD}"

            # --------------------------------------------------
            # Initialize OpenTofu
            #
            # No lockfile is committed to Git.
            # A temporary lock file may be generated on this
            # ephemeral runner.
            # --------------------------------------------------

            tofu init \
              -input=false

            # --------------------------------------------------
            # Locate exact plan
            # --------------------------------------------------

            PLAN_NAME="$(echo "${DIR}" | tr '/' '_')"

            PLAN_FILE="${PLAN_DIRECTORY}/${PLAN_NAME}.tfplan"

            if [[ ! -f "${PLAN_FILE}" ]]; then

              echo "::error::Approved plan not found:"
              echo "${PLAN_FILE}"

              exit 1

            fi

            echo "Applying exact plan:"
            echo "${PLAN_FILE}"

            # --------------------------------------------------
            # Apply EXACT plan generated by Plan job
            # --------------------------------------------------

            tofu apply \
              -input=false \
              "${PLAN_FILE}"

            echo "::notice::OpenTofu apply completed successfully for ${DIR}"

            echo "::endgroup::"

          done < "${DIRS_FILE}"
