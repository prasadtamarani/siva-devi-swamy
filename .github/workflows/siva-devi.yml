name: OpenTofu Apply Workflow

on:
  push:
    branches:
      - main
    paths:
      - 'workspace/**'

permissions:
  contents: read

concurrency:
  group: tofu-apply-${{ github.ref }}
  cancel-in-progress: false

env:
  TOFU_VERSION: "1.12.5"

  GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}

  GCP_WORKLOAD_IDENTITY_PROVIDER: >-
    ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}

  GCP_SERVICE_ACCOUNT: >-
    ${{ vars.GCP_SERVICE_ACCOUNT }}

  CHECKOV_EXCEPTIONS_FILE: "exceptions/terraform-exceptions.txt"

jobs:

  # ============================================================
  # OPEN TOFU PLAN
  # ============================================================

  tofu-plan:
    name: OpenTofu Plan
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      id-token: write
      contents: read

    outputs:
      plan_created: ${{ steps.plan.outputs.plan_created }}
      dirs: ${{ steps.find_dirs.outputs.dirs }}

    steps:

      # ----------------------------------------------------------
      # Checkout
      # ----------------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ----------------------------------------------------------
      # Setup OpenTofu
      # ----------------------------------------------------------

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@v2
        with:
          tofu_version: ${{ env.TOFU_VERSION }}
          tofu_wrapper: false

      # ----------------------------------------------------------
      # Verify OpenTofu
      # ----------------------------------------------------------

      - name: Verify OpenTofu
        shell: bash
        run: |
          set -euo pipefail
          tofu version

      # ----------------------------------------------------------
      # Setup Google Cloud CLI
      # ----------------------------------------------------------

      - name: Setup Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v3

      # ----------------------------------------------------------
      # Authenticate to GCP using Workload Identity Federation
      # ----------------------------------------------------------

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_SERVICE_ACCOUNT }}

      # ----------------------------------------------------------
      # Verify GCP authentication
      # ----------------------------------------------------------

      - name: Verify GCP authentication
        shell: bash
        run: |
          set -euo pipefail

          gcloud auth list
          gcloud config set project "${GCP_PROJECT_ID}"

      # ----------------------------------------------------------
      # Identify OpenTofu root directories
      #
      # Any change under workspace/ triggers the workflow.
      #
      # Reusable modules under */modules/* are excluded because
      # they should not be independently planned/applied.
      # ----------------------------------------------------------

      - name: Find OpenTofu directories
        id: find_dirs
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t DIRS < <(
            find workspace \
              -type f \
              -name "*.tf" \
              -not -path "*/modules/*" \
              -printf '%h\n' |
            sort -u
          )

          if [[ "${#DIRS[@]}" -eq 0 ]]; then
            echo "::error::No OpenTofu root directories found under workspace/"
            exit 1
          fi

          echo "OpenTofu root directories found:"
          printf '%s\n' "${DIRS[@]}"

          {
            echo "dirs<<EOF"
            printf '%s\n' "${DIRS[@]}"
            echo "EOF"
          } >> "${GITHUB_OUTPUT}"

      # ----------------------------------------------------------
      # Create plan directory
      # ----------------------------------------------------------

      - name: Create plan directory
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/tofu-plans"

      # ==========================================================
      # OpenTofu Init, Format, Validate and Plan
      # ==========================================================

      - name: Run OpenTofu plan
        id: plan
        shell: bash
        run: |
          set -euo pipefail

          PLAN_DIRECTORY="${RUNNER_TEMP}/tofu-plans"

          while IFS= read -r DIR; do
            [[ -z "${DIR}" ]] && continue

            echo "::group::OpenTofu - ${DIR}"

            cd "${GITHUB_WORKSPACE}/${DIR}"

            echo "Working directory:"
            echo "${PWD}"

            # --------------------------------------------------
            # OpenTofu Init
            # --------------------------------------------------

            tofu init \
              -input=false

            # --------------------------------------------------
            # OpenTofu Format Check
            # --------------------------------------------------

            tofu fmt \
              -check \
              -diff

            # --------------------------------------------------
            # OpenTofu Validate
            # --------------------------------------------------

            tofu validate

            # --------------------------------------------------
            # Generate unique plan name
            # --------------------------------------------------

            PLAN_NAME="$(
              echo "${DIR}" |
              tr '/' '_'
            )"

            PLAN_FILE="${PLAN_DIRECTORY}/${PLAN_NAME}.tfplan"

            # --------------------------------------------------
            # OpenTofu Plan
            # --------------------------------------------------

            echo "Creating plan:"
            echo "${PLAN_FILE}"

            tofu plan \
              -input=false \
              -out="${PLAN_FILE}"

            # --------------------------------------------------
            # Convert plan to JSON for Checkov
            # --------------------------------------------------

            tofu show \
              -json \
              "${PLAN_FILE}" \
              > "${PLAN_FILE}.json"

            echo "Plan created successfully:"
            ls -lh "${PLAN_FILE}"
            ls -lh "${PLAN_FILE}.json"

            echo "::endgroup::"

          done <<< "${{ steps.find_dirs.outputs.dirs }}"

          echo "plan_created=true" >> "${GITHUB_OUTPUT}"

      # ==========================================================
      # TFSEC
      # ==========================================================

      - name: Install tfsec
        shell: bash
        run: |
          set -euo pipefail

          TFSEC_VERSION="v1.28.14"
          TFSEC_PATH="${RUNNER_TEMP}/tfsec"

          echo "Installing tfsec ${TFSEC_VERSION}"

          curl -sSL \
            -o "${TFSEC_PATH}" \
            "https://github.com/aquasecurity/tfsec/releases/download/${TFSEC_VERSION}/tfsec-linux-amd64"

          chmod +x "${TFSEC_PATH}"

          echo "Verifying tfsec installation:"
          "${TFSEC_PATH}" --version

      - name: Run tfsec
        shell: bash
        run: |
          set -euo pipefail

          TFSEC_PATH="${RUNNER_TEMP}/tfsec"

          if [[ ! -x "${TFSEC_PATH}" ]]; then
            echo "::error::tfsec executable not found at ${TFSEC_PATH}"
            exit 1
          fi

          while IFS= read -r DIR; do
            [[ -z "${DIR}" ]] && continue

            echo "::group::tfsec - ${DIR}"

            cd "${GITHUB_WORKSPACE}/${DIR}"

            echo "Running tfsec in:"
            echo "${PWD}"

            "${TFSEC_PATH}"

            echo "::endgroup::"

          done <<< "${{ steps.find_dirs.outputs.dirs }}"

      # ==========================================================
      # CHECKOV
      # ==========================================================

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install Checkov
        shell: bash
        run: |
          set -euo pipefail

          python -m pip install --upgrade pip checkov

          checkov --version

      - name: Run Checkov
        shell: bash
        run: |
          set -euo pipefail

          EXCEPTIONS_FILE="${GITHUB_WORKSPACE}/${CHECKOV_EXCEPTIONS_FILE}"
          CHECKOV_SKIP_CHECKS=""

          if [[ -f "${EXCEPTIONS_FILE}" ]]; then

            echo "Reading Checkov exceptions from:"
            echo "${EXCEPTIONS_FILE}"

            CHECKOV_SKIP_CHECKS="$(
              grep -vE '^[[:space:]]*#|^[[:space:]]*$' \
                "${EXCEPTIONS_FILE}" |
              tr '\n' ',' |
              sed 's/,$//'
            )

          else

            echo "No Checkov exception file found."

          fi

          if [[ -n "${CHECKOV_SKIP_CHECKS}" ]]; then

            echo "Approved Checkov exceptions:"
            echo "${CHECKOV_SKIP_CHECKS}"

          else

            echo "No Checkov exceptions configured."

          fi

          while IFS= read -r DIR; do
            [[ -z "${DIR}" ]] && continue

            PLAN_NAME="$(
              echo "${DIR}" |
              tr '/' '_'
            )"

            PLAN_JSON="${RUNNER_TEMP}/tofu-plans/${PLAN_NAME}.tfplan.json"

            if [[ ! -f "${PLAN_JSON}" ]]; then
              echo "::error::Checkov plan file not found:"
              echo "${PLAN_JSON}"
              exit 1
            fi

            echo "::group::Checkov - ${DIR}"

            if [[ -n "${CHECKOV_SKIP_CHECKS}" ]]; then

              CKV_SKIP_CHECK="${CHECKOV_SKIP_CHECKS}" \
                checkov \
                -f "${PLAN_JSON}" \
                --framework terraform

            else

              checkov \
                -f "${PLAN_JSON}" \
                --framework terraform

            fi

            echo "::endgroup::"

          done <<< "${{ steps.find_dirs.outputs.dirs }}"

      # ==========================================================
      # UPLOAD PLAN
      # ==========================================================

      - name: Upload OpenTofu plan
        uses: actions/upload-artifact@v4
        with:
          name: tofu-plan-${{ github.sha }}
          path: ${{ runner.temp }}/tofu-plans/
          if-no-files-found: error
          retention-days: 5


  # ============================================================
  # OPEN TOFU APPLY
  #
  # GitHub Environment "production" provides the approval gate
  # when environment protection rules are available/configured.
  # ============================================================

  tofu-apply:
    name: OpenTofu Apply
    runs-on: ubuntu-latest
    timeout-minutes: 30

    needs:
      - tofu-plan

    if: needs.tofu-plan.outputs.plan_created == 'true'

    environment:
      name: production

    permissions:
      id-token: write
      contents: read

    steps:

      # ----------------------------------------------------------
      # Checkout exact commit
      # ----------------------------------------------------------

      - name: Checkout exact commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      # ----------------------------------------------------------
      # Setup OpenTofu
      # ----------------------------------------------------------

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@v2
        with:
          tofu_version: ${{ env.TOFU_VERSION }}
          tofu_wrapper: false

      # ----------------------------------------------------------
      # Verify OpenTofu
      # ----------------------------------------------------------

      - name: Verify OpenTofu
        shell: bash
        run: |
          set -euo pipefail
          tofu version

      # ----------------------------------------------------------
      # Setup Google Cloud CLI
      # ----------------------------------------------------------

      - name: Setup Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v3

      # ----------------------------------------------------------
      # Authenticate to GCP using WIF
      # ----------------------------------------------------------

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_SERVICE_ACCOUNT }}

      # ----------------------------------------------------------
      # Verify GCP authentication
      # ----------------------------------------------------------

      - name: Verify GCP authentication
        shell: bash
        run: |
          set -euo pipefail

          gcloud auth list
          gcloud config set project "${GCP_PROJECT_ID}"

      # ----------------------------------------------------------
      # Download EXACT plan generated by Plan job
      # ----------------------------------------------------------

      - name: Download approved OpenTofu plan
        uses: actions/download-artifact@v4
        with:
          name: tofu-plan-${{ github.sha }}
          path: ${{ runner.temp }}/tofu-plans

      # ----------------------------------------------------------
      # Verify plan artifact
      # ----------------------------------------------------------

      - name: Verify plan artifact
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! -d "${RUNNER_TEMP}/tofu-plans" ]]; then
            echo "::error::OpenTofu plan directory not found."
            exit 1
          fi

          echo "Approved plan files:"

          find "${RUNNER_TEMP}/tofu-plans" \
            -maxdepth 1 \
            -type f \
            -name "*.tfplan" \
            -print

      # ==========================================================
      # Apply EXACT approved plan
      # ==========================================================

      - name: Apply approved plan
        shell: bash
        run: |
          set -euo pipefail

          PLAN_DIRECTORY="${RUNNER_TEMP}/tofu-plans"

          while IFS= read -r DIR; do
            [[ -z "${DIR}" ]] && continue

            echo "::group::OpenTofu Apply - ${DIR}"

            cd "${GITHUB_WORKSPACE}/${DIR}"

            echo "Working directory:"
            echo "${PWD}"

            # --------------------------------------------------
            # Initialize OpenTofu
            # --------------------------------------------------

            tofu init \
              -input=false \
              -lockfile=readonly

            # --------------------------------------------------
            # Locate exact approved plan
            # --------------------------------------------------

            PLAN_NAME="$(
              echo "${DIR}" |
              tr '/' '_'
            )"

            PLAN_FILE="${PLAN_DIRECTORY}/${PLAN_NAME}.tfplan"

            if [[ ! -f "${PLAN_FILE}" ]]; then
              echo "::error::Approved plan not found:"
              echo "${PLAN_FILE}"
              exit 1
            fi

            echo "Applying approved plan:"
            echo "${PLAN_FILE}"

            # --------------------------------------------------
            # Apply EXACT plan reviewed by approver
            # --------------------------------------------------

            tofu apply \
              -input=false \
              "${PLAN_FILE}"

            echo "::notice::OpenTofu apply completed successfully for ${DIR}"

            echo "::endgroup::"

          done <<< "${{ needs.tofu-plan.outputs.dirs }}"
